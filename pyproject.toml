[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "priestcode"
version = "1.3.4"
description = "Priest Code — a fast, transparent terminal coding agent. Opens your repo, edits it, runs your tests, and iterates until they pass."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "the-priest" }]
keywords = ["ai", "coding-agent", "cli", "tui", "deepseek", "siliconflow",
            "opencode", "terminal", "mcp"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development",
]
# Textual draws the full-screen UI; Rich renders the transcript and the
# headless mode. Everything else is the standard library.
dependencies = ["textual>=0.80", "rich>=13.0"]

[project.scripts]
priest = "priestcode.cli:main"
priestcode = "priestcode.cli:main"

[project.urls]
Homepage = "https://github.com/the-priest/priestcode"
Repository = "https://github.com/the-priest/priestcode"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
# scope discovery to the real packages so the data-only skills/ dir is NOT
# mistaken for an importable subpackage (it ships as package-data instead).
include = ["priestcode", "priestcode.tui"]

[tool.setuptools.package-data]
# the bundled skill library ships with the package (flat dir, category in frontmatter)
priestcode = ["skills/*.md"]
